name: Mini Vault CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  TZ: Asia/Ho_Chi_Minh
  SID1: 23127077
  SID2: 23127355

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit pip-audit

      - name: Lint and Format Check (Ruff)
        working-directory: src/backend
        run: |
          ruff check .
          ruff format --check .

      - name: Security Scan (Bandit)
        working-directory: src/backend
        run: |
          bandit -r . -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        working-directory: src/backend
        run: |
          pip-audit

      - name: Run tests
        working-directory: src/backend
        run: |
          pytest
          
      - name: Archive
        run: |
          zip -r ${{ env.SID1 }}_${{ env.SID2 }}.zip . -x "*.git*" "*__pycache__*" "*.venv*"

      - name: Get current date and time
        id: datetime
        run: echo "datetime=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artifact-${{ github.run_number }}-${{ steps.datetime.outputs.datetime }}
          path: ${{ env.SID1 }}_${{ env.SID2 }}.zip
